[package]
name = "lfm2-audio"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of LFM2.5-Audio multimodal model (ASR, TTS, Interleaved)"
license = "MIT"
repository = "https://github.com/yourusername/lfm2-audio-rs"

[dependencies]
# Core
anyhow = "1"
ndarray = { version = "0.17", features = ["serde"] }
ort = "2.0.0-rc.12"
hound = "3.5"
num-complex = "0.4"

# Tokenization
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio processing
realfft = "3"

# Logging
log = "0.4"
env_logger = "0.11"

# Random sampling
rand = "0.8"

# Error handling
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"], optional = true }

# Server
axum = { version = "0.8", features = ["multipart", "ws"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
base64 = { version = "0.22", optional = true }
futures-util = { version = "0.3", optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }

[features]
default = ["cli"]
cli = ["dep:clap"]
server = ["dep:axum", "dep:tokio", "dep:tokio-stream", "dep:tracing", "dep:tracing-subscriber", "dep:base64", "dep:futures-util", "dep:tower-http"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]

[[bin]]
name = "lfm2-audio"
path = "src/bin/main.rs"
required-features = ["cli"]

[[bin]]
name = "lfm2-server"
path = "src/bin/server.rs"
required-features = ["server"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
